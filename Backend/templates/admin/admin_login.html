{% extends "base.html" %}

{% block title %}
Admin Login
{% endblock %}

{% block extra_css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            <i class="bi bi-shield-lock"></i>
            <span>Lumora Admin</span>
        </div>

        <h1>Admin Login</h1>

        <p class="auth-subtitle">
            Sign in to manage Lumora and view analytics.
        </p>


        {% if error %}

            <div class="flash-messages">

                <div class="flash-message error">
                    {{ error }}
                </div>

            </div>

        {% endif %}


        <form
            action="{{ url_for('admin.admin_login') }}"
            method="POST"
            class="auth-form"
        >

            <div class="form-group">

                <label for="email">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                <i class="bi bi-box-arrow-in-right"></i>
                Admin Login
            </button>

        </form>


        <p class="auth-footer">

            <a href="http://127.0.0.1:5000/login">
                ← Back to User Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
